name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  # The SDL release the bindings are generated from is pinned in the
  # SDL_VERSION file; cmd/sdlsync downloads its headers.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: cross-compile
        run: |
          for t in linux/amd64 linux/arm64 linux/386 windows/amd64 windows/arm64 windows/386 darwin/amd64 darwin/arm64; do
            echo "== $t"
            GOOS=${t%/*} GOARCH=${t#*/} go build ./...
            GOOS=${t%/*} GOARCH=${t#*/} go vet ./...
            GOOS=${t%/*} GOARCH=${t#*/} go test -c -o /dev/null ./sdl
          done

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Run the SDL3 library of the pinned release so that sdl/abi_test.go
      # compares the bindings with exactly the library they were generated for.
      - name: Read pinned SDL release
        shell: bash
        run: |
          tag="$(tr -d '[:space:]' < SDL_VERSION)"
          echo "SDL_RUNTIME_TAG=$tag" >> "$GITHUB_ENV"
          echo "SDL_RUNTIME_VERSION=${tag#release-}" >> "$GITHUB_ENV"

      - name: Install SDL3 (Linux, built from source)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        id: sdl-cache
        with:
          path: ~/sdl3-install
          key: sdl3-${{ matrix.os }}-${{ env.SDL_RUNTIME_TAG }}
      - name: Build SDL3 (Linux)
        if: runner.os == 'Linux' && steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build build-essential
          git clone --depth 1 --branch "$SDL_RUNTIME_TAG" https://github.com/libsdl-org/SDL.git /tmp/sdl
          cmake -S /tmp/sdl -B /tmp/sdl/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="$HOME/sdl3-install"
          cmake --build /tmp/sdl/build
          cmake --install /tmp/sdl/build
      - name: Point the loader at SDL3 (Linux)
        if: runner.os == 'Linux'
        run: echo "SDL3_LIBRARY=$(ls $HOME/sdl3-install/lib*/libSDL3.so.0 | head -n1)" >> "$GITHUB_ENV"

      - name: Install SDL3 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl3

      - name: Install SDL3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "SDL3-$env:SDL_RUNTIME_VERSION-win32-x64.zip"
          Invoke-WebRequest "https://github.com/libsdl-org/SDL/releases/download/$env:SDL_RUNTIME_TAG/$zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\sdl3"
          $dll = Get-ChildItem "$env:RUNNER_TEMP\sdl3" -Recurse -Filter SDL3.dll | Select-Object -First 1
          "SDL3_LIBRARY=$($dll.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # The generator tests read the headers of the pinned release (they
      # fail instead of skipping on CI).
      - name: Sync SDL headers
        shell: bash
        run: echo "SDL_INCLUDE=$(go run ./cmd/sdlsync -print-include)" >> "$GITHUB_ENV"
      # The tests select the dummy video/audio/camera drivers and the software
      # renderer themselves (internal/sdltest) and skip when libSDL3 cannot be
      # loaded, so no SDL_* variables are needed here.
      - name: test
        run: go test ./... -count=1
      - name: test (shuffled, repeated)
        run: go test ./examples/... -count=3 -shuffle=on
      # A plain `go run` is not a test: select the dummy drivers explicitly.
      - name: example
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: go run ./examples/renderer/01-clear -frames 3

  generated:
    name: generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check generated code against the pinned SDL release
        run: go run ./cmd/sdlsync -check
      - name: Fail on diff
        run: |
          git status --short
          git diff --exit-code
          test -z "$(git status --porcelain)"
